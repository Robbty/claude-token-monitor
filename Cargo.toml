[package]
name = "claude-token-monitor"
version = "0.2.0"
edition = "2024"
description = "Stdout token/context monitor for the currently active Claude Code session"
license = "MIT"

[[bin]]
name = "claude-tokens"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# rustls-only TLS so musl-static builds keep working; no OpenSSL dep.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
