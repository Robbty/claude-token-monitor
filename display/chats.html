<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Claude Token Monitor — Letzte Chats</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    body { background: var(--bg); padding: 0; overflow-y: auto; }
    .chatswrap { max-width: 860px; margin: 0 auto; padding: 22px 28px 40px; }
    .chatstools {
      margin-bottom: 18px; padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      /* bleibt beim Scrollen oben — das Suchfeld muss erreichbar bleiben */
      position: sticky; top: 0; z-index: 5; background: var(--bg);
      padding-top: 22px; margin-top: -22px;
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    }
    .chatstools h1 { font-size: 16px; margin: 0; color: var(--fg); flex: 1; }
    .chatstools button {
      background: var(--bg-elev); border: 1px solid var(--border);
      color: var(--fg-dim); border-radius: 4px; padding: 5px 11px;
      font-size: 12px; cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .chatstools button:hover {
      background: var(--bg-hover); color: var(--fg); border-color: var(--accent);
    }
    .limit { display: flex; gap: 5px; align-items: center;
             font-size: 12px; color: var(--fg-dim); }
    .limit input {
      width: 52px; background: var(--bg-elev); border: 1px solid var(--border);
      color: var(--fg); border-radius: 4px; padding: 4px 6px; font-size: 12px;
    }
    .searchrow {
      flex-basis: 100%; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap;
    }
    .searchrow input {
      flex: 1; max-width: 440px; background: var(--bg-elev);
      border: 1px solid var(--border); color: var(--fg); border-radius: 4px;
      padding: 5px 9px; font-size: 12.5px; font-family: inherit;
    }
    .searchrow input:focus { outline: none; border-color: var(--accent); }
    .search-info { font-size: 12px; color: var(--fg-dim); }
    .search-info.error { color: var(--red); }
    table.chats { width: 100%; border-collapse: collapse; font-size: 13px; }
    .chats th {
      text-align: left; color: var(--fg-mute); font-weight: 500; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 6px 10px; border-bottom: 1px solid var(--border);
    }
    .chats th.sortable { cursor: pointer; user-select: none; }
    .chats th.sortable:hover { color: var(--fg); }
    .chats th.sortable .arrow { margin-left: 4px; color: var(--accent); }
    .chats td {
      padding: 8px 10px; border-bottom: 1px solid var(--border);
      color: var(--fg); vertical-align: top;
    }
    .chats tr.row { cursor: pointer; }
    /* 🔍-Treffer: blau getönt mit Balken links; Nicht-Treffer gedimmt.
       Steht vor :hover/.expanded, damit die bei Gleichstand gewinnen. */
    .chats tr.row.hit td { background: rgba(110, 161, 255, 0.10); }
    .chats tr.row.hit td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
    .chats tr.row { scroll-margin-top: 160px; } /* nicht unter der Suchleiste landen */
    .chats tr.row.nohit td { opacity: 0.45; }
    .chats tr.row:hover td { background: var(--bg-hover); }
    .chats tr.row.expanded td { background: var(--bg-elev); }
    td.dir { white-space: nowrap; color: var(--fg-dim); }
    td.dir .live { color: var(--green); margin-right: 4px; }
    td.age { white-space: nowrap; color: var(--fg-mute); }
    td.topic .fallback { color: var(--fg-dim); font-style: italic; }
    td.topic .none { color: var(--fg-mute); font-style: italic; }
    td.topic .custom { border-bottom: 1px dotted var(--fg-mute); }
    td.topic .rename-btn {
      background: none; border: none; cursor: pointer;
      font-size: 12px; line-height: 1; color: var(--fg-mute);
      padding: 2px 4px; margin-left: 5px; border-radius: 4px;
      opacity: 0; transition: color 0.12s, background 0.12s, opacity 0.12s;
    }
    tr.row:hover .rename-btn { opacity: 1; }
    td.topic .rename-btn:hover { color: var(--fg); background: var(--bg-hover); }
    td.topic input.rename-input {
      width: 100%; box-sizing: border-box;
      background: var(--bg); border: 1px solid var(--accent);
      color: var(--fg); border-radius: 4px; padding: 3px 7px;
      font-size: 12.5px; font-family: inherit;
    }
    .worker-chip {
      font-size: 10px; font-weight: 600; color: var(--fg-dim);
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 3px; padding: 1px 5px; margin-right: 6px;
      white-space: nowrap; vertical-align: 1px;
    }
    .hit-chip {
      font-size: 10.5px; font-weight: 600; color: var(--accent);
      border: 1px solid var(--accent); border-radius: 3px;
      padding: 0 5px; margin-right: 6px;
      white-space: nowrap; vertical-align: 1px;
    }
    mark { background: var(--yellow); color: #111; border-radius: 2px; padding: 0 1px; }
    .hits {
      margin: 0 0 12px; padding: 9px 11px 1px;
      border: 1px dashed var(--accent); border-radius: 4px;
    }
    .hits-title { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 7px; }
    .tail-title { font-size: 11px; font-weight: 600; color: var(--fg-mute); margin-bottom: 7px; }
    td.fav { width: 1%; white-space: nowrap; padding-right: 2px; }
    td.fav button {
      background: none; border: none; cursor: pointer;
      font-size: 14px; line-height: 1; color: var(--fg-mute);
      padding: 3px 4px; border-radius: 4px;
      transition: color 0.12s, background 0.12s;
    }
    td.fav button:hover { color: var(--yellow); background: var(--bg-hover); }
    td.fav button.on { color: var(--yellow); }
    td.del { width: 1%; white-space: nowrap; text-align: right; }
    td.del button {
      background: none; border: none; cursor: pointer;
      font-size: 13px; line-height: 1; color: var(--fg-mute);
      padding: 3px 5px; border-radius: 4px;
      transition: color 0.12s, background 0.12s;
    }
    td.del button:hover:not(:disabled) { color: var(--red); background: var(--bg-hover); }
    td.del button:disabled { opacity: 0.35; cursor: default; }
    td.del .confirm { font-size: 11.5px; color: var(--fg-dim); }
    td.del .confirm button {
      font-size: 11.5px; border: 1px solid var(--border);
      background: var(--bg-elev); color: var(--fg-dim); margin-left: 5px;
      padding: 2px 8px;
    }
    td.del .confirm button.yes:hover { color: #fff; background: var(--red); border-color: var(--red); }
    td.del .confirm button:not(.yes):hover { color: var(--fg); border-color: var(--accent); background: var(--bg-hover); }
    tr.detail > td { background: var(--bg-elev); padding: 12px 14px 14px; }
    .detail-actions {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .detail-actions button {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--fg-dim); border-radius: 4px; padding: 4px 9px;
      font-size: 12px; cursor: pointer;
    }
    .detail-actions button:hover { color: var(--fg); border-color: var(--accent); }
    .detail-actions .sid { font-size: 11px; color: var(--fg-mute); font-family: monospace; }
    .msg { margin: 0 0 10px; }
    .msg .who { font-size: 11px; font-weight: 600; margin-bottom: 2px; }
    .msg.user .who { color: var(--accent); }
    .msg.assistant .who { color: var(--fg-dim); }
    .msg .text {
      white-space: pre-wrap; overflow-wrap: anywhere;
      font-size: 12.5px; line-height: 1.45; color: var(--fg);
      border-left: 2px solid var(--border); padding-left: 9px;
    }
    .msg.user .text { border-left-color: var(--accent); }
    .detail-hint { font-size: 11px; color: var(--fg-mute); font-style: italic; margin-bottom: 8px; }
    .state { padding: 24px 10px; color: var(--fg-dim); font-size: 13px; }
    .state.error { color: var(--red); }
  </style>
</head>
<body>
  <div class="chatswrap">
    <div class="chatstools">
      <h1>🕘 Letzte Chats</h1>
      <label class="limit" title="Wie viele Chats je Projektverzeichnis maximal berücksichtigt werden">
        Pro Verzeichnis
        <input type="number" id="per-dir" min="1" max="20" />
      </label>
      <label class="limit" title="Wie viele Chats insgesamt angezeigt werden (nach dem Pro-Verzeichnis-Filter)">
        Gesamt
        <input type="number" id="total" min="1" max="100" />
      </label>
      <label class="toggle"
             title="Gerade laufende Chats (●) vorrangig oben einsortieren — bei Sortierung nach Verzeichnis rückt das ganze Verzeichnis nach oben">
        <input type="checkbox" id="active-first" />
        <span class="toggle__slider"></span>
        <span class="toggle__label">Aktive zuerst</span>
      </label>
      <label class="toggle"
             title="Auch Hintergrund-Worker (Subagenten) auflisten — von einer Session gestartete Agenten; sie konkurrieren um dieselben Listen-Plätze">
        <input type="checkbox" id="show-workers" />
        <span class="toggle__slider"></span>
        <span class="toggle__label">Worker</span>
      </label>
      <label class="toggle"
             title="Nur favorisierte Chats (★) anzeigen — Favoriten stehen immer oben und fallen nie aus den Limits heraus, egal wie alt sie sind">
        <input type="checkbox" id="only-favorites" />
        <span class="toggle__slider"></span>
        <span class="toggle__label">Nur ★</span>
      </label>
      <button id="refresh-btn" title="Liste neu laden">🔄 Aktualisieren</button>
      <div class="searchrow">
        <input type="search" id="search" maxlength="200" autocomplete="off" spellcheck="false"
               placeholder="🔍 Suchen, z. B. restic  oder  steuer AND (binance OR poloniex)"
               title="Durchsucht nur die hier gelisteten Chats, diese aber vollständig: deine Nachrichten, Claudes Antworten, Titel und eigene Namen. Groß-/Kleinschreibung ist egal.&#10;&#10;Mehrere Wörter: alle müssen im Chat vorkommen.&#10;AND, OR, NOT (auch UND, ODER, NICHT) in Großbuchstaben, Klammern ( ) zum Gruppieren.&#10;&quot;…&quot; sucht eine genaue Wortfolge.&#10;&#10;Treffer werden markiert (mit „Nur Treffer“ allein gelistet); Enter springt zum nächsten Treffer, Esc leert das Feld." />
        <label class="toggle"
               title="Während einer Suche nur die passenden Chats auflisten, statt die übrigen blass anzuzeigen. Ohne Suchbegriff stehen wie gewohnt alle Chats da.">
          <input type="checkbox" id="only-hits" />
          <span class="toggle__slider"></span>
          <span class="toggle__label">Nur Treffer</span>
        </label>
        <span id="search-info" class="search-info"></span>
      </div>
    </div>
    <table class="chats">
      <thead>
        <tr>
          <th title="Favorit — steht immer oben, fällt nie aus den Limits heraus">★</th>
          <th class="sortable" data-sort="dir" title="Nach Verzeichnis sortieren">Verzeichnis<span class="arrow"></span></th>
          <th class="sortable" data-sort="age" title="Nach letzter Aktivität sortieren">Wann<span class="arrow"></span></th>
          <th>Thema</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="state" class="state">Lade Chats …</div>
  </div>

  <script>
  const rowsEl = document.getElementById("rows");
  const stateEl = document.getElementById("state");
  const perDirEl = document.getElementById("per-dir");
  const totalEl = document.getElementById("total");
  const activeFirstEl = document.getElementById("active-first");
  const showWorkersEl = document.getElementById("show-workers");
  const onlyFavoritesEl = document.getElementById("only-favorites");
  const searchEl = document.getElementById("search");
  const onlyHitsEl = document.getElementById("only-hits");
  const searchInfoEl = document.getElementById("search-info");
  const detailCache = new Map(); // sid → detail JSON
  let lastChats = []; // zuletzt geladene Liste, für Neu-Sortierung ohne Fetch
  let expandedSid = null; // aufgeklappter Verlauf — bleibt beim Neu-Rendern offen
  // „Letzte Zeilen": so viele Textzeilen vom Ende des Chats zeigt der
  // aufgeklappte Verlauf, vollständig (Feld im Verlauf, gespeichert).
  const DETAIL_LINES_DEFAULT = 50;
  const DETAIL_LINES_MAX = 1000;
  let detailLines = DETAIL_LINES_DEFAULT;

  // 🔍 Suche: durchsucht NUR die gelisteten Chats (lastChats), diese aber
  // vollständig. Der Server wertet den Suchausdruck aus (Wörter, "Wortfolge",
  // AND/OR/NOT, Klammern — je Chat, siehe POST /chat-search) und liefert die
  // passenden Chats. Treffer werden markiert, nicht gefiltert — die übrigen
  // Zeilen bleiben gedimmt sichtbar. Der Suchausdruck wird nicht gespeichert.
  const SEARCH_MIN_CHARS = 2;
  const SEARCH_DEBOUNCE_MS = 350;
  let searchQuery = "";     // Ausdruck der zuletzt fertigen Suche
  let searchTerms = [];     // ihre (nicht verneinten) Begriffe — zum Hervorheben
  let searchResults = null; // sid → {hits, snippets, in_title}; null = keine Suche aktiv
  let searchAbort = null;
  let searchTimer = null;
  let searchJump = -1;      // Index des zuletzt per Enter angesprungenen Treffers

  // Sortierung: "dir" = Verzeichnisname/Ort (Default; innerhalb eines
  // Verzeichnisses neueste oben), "age" = letzte Aktivität (neueste oben).
  // Favoriten (★) stehen IMMER zuoberst, unabhängig von Alter und Sortierung;
  // innerhalb der Favoriten gilt die normale Sortierung weiter.
  // "Aktive zuerst" hat Vorrang vor der Spalten-Sortierung: laufende Chats —
  // bei "dir" ganze Verzeichnisse mit laufendem Chat — stehen dann oben, die
  // normale Sortierung gilt innerhalb der Gruppen weiter.
  let sortKey = "dir";
  let sortAsc = true; // bei "age": aufsteigende age_seconds = neueste oben

  function sortedChats() {
    let chats = [...lastChats];
    if (onlyFavoritesEl.checked) chats = chats.filter((c) => c.favorite);
    const activeFirst = activeFirstEl.checked;
    const sign = sortAsc ? 1 : -1;
    const favPrio = (a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0);
    if (sortKey === "dir") {
      const activeDirs = new Set(
        activeFirst ? chats.filter((c) => c.active).map((c) => c.dir_name) : []);
      chats.sort((a, b) => {
        const fav = favPrio(a, b);
        if (fav) return fav;
        const prio = (activeDirs.has(b.dir_name) ? 1 : 0) - (activeDirs.has(a.dir_name) ? 1 : 0);
        if (prio) return prio;
        const dir = a.dir_name.localeCompare(b.dir_name, "de") * sign;
        if (dir) return dir;
        if (activeFirst && a.active !== b.active) return a.active ? -1 : 1;
        return a.age_seconds - b.age_seconds; // im Verzeichnis: neueste oben
      });
    } else {
      chats.sort((a, b) => {
        const fav = favPrio(a, b);
        if (fav) return fav;
        if (activeFirst && a.active !== b.active) return a.active ? -1 : 1;
        return (a.age_seconds - b.age_seconds) * sign;
      });
    }
    return chats;
  }

  // Neu rendern ohne Fetch (Sortierung/Filter/Suche geändert oder ★ umgeschaltet).
  function rerender() {
    const chats = sortedChats();
    // „Nur Treffer": während einer Suche nur die passenden Chats zeigen statt
    // die übrigen zu dimmen. Die Trefferzahl zählt weiter über alle (chats).
    const shown = searchResults && onlyHitsEl.checked
      ? chats.filter((c) => searchHit(c)) : chats;
    renderRows(shown);
    updateSearchInfo(chats);
    if (!lastChats.length) return; // Leer-/Fehlerzustand gehört loadChats
    stateEl.className = "state";
    if (shown.length) stateEl.textContent = "";
    else if (chats.length) stateEl.textContent = "Kein Chat passt zur Suche — „Nur Treffer“ ausschalten zeigt wieder alle.";
    else stateEl.textContent = "Keine Favoriten — ★ in einer Zeile setzt einen.";
  }

  // Treffer der aktiven Suche für einen Chat (vom Server) oder null:
  // hits = Anzahl Nachrichten mit einem der Suchbegriffe, snippets = die
  // ersten Fundstellen, in_title = ein Suchbegriff steht im Titel/eigenen Namen.
  function searchHit(chat) {
    return searchResults ? searchResults[chat.session_id] || null : null;
  }

  // Text in el setzen; die Begriffe der aktiven Suche mit <mark> hervorheben
  // (längere zuerst, damit „restic-sicherung“ vor „restic“ greift). Nur in
  // Chats, die zur Suche passen (on) — bei `a AND b` kann ein Nicht-Treffer b
  // im Titel tragen, gelb sähe er dann fälschlich wie ein Treffer aus.
  function setHighlighted(el, text, on) {
    el.textContent = "";
    if (!on || !searchResults || !searchTerms.length) {
      el.textContent = text;
      return;
    }
    const re = new RegExp(
      [...searchTerms].sort((a, b) => b.length - a.length)
        .map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"),
      "gi");
    let pos = 0;
    for (const m of text.matchAll(re)) {
      el.append(text.slice(pos, m.index));
      const mark = document.createElement("mark");
      mark.textContent = m[0];
      el.append(mark);
      pos = m.index + m[0].length;
    }
    el.append(text.slice(pos));
  }

  // Zeile neben dem Suchfeld: Zustand bzw. „…“: Treffer in X von Y Chats.
  // Gezählt werden die sichtbaren Zeilen (bei „Nur ★" also nur Favoriten).
  function updateSearchInfo(visible) {
    searchInfoEl.className = "search-info";
    const typed = searchEl.value.trim();
    if (!typed || !lastChats.length) {
      searchInfoEl.textContent = "";
    } else if (typed.length < SEARCH_MIN_CHARS) {
      searchInfoEl.textContent = `mindestens ${SEARCH_MIN_CHARS} Zeichen`;
    } else if (!searchResults || typed !== searchQuery) {
      searchInfoEl.textContent = "Suche läuft …";
    } else {
      const n = visible.filter((c) => searchHit(c)).length;
      searchInfoEl.textContent = n
        ? `Treffer in ${n} von ${visible.length} Chats`
        : `kein Treffer in den ${visible.length} Chats`;
    }
  }

  // jump: nach der Suche zum ersten Treffer scrollen — nur bei Eingabe ins Suchfeld,
  // nicht beim Neuladen der Liste (🔄, Löschen, Limits).
  async function runSearch(jump = false) {
    clearTimeout(searchTimer);
    if (searchAbort) searchAbort.abort();
    searchAbort = null;
    const q = searchEl.value.trim();
    if (q.length < SEARCH_MIN_CHARS || !lastChats.length) {
      searchQuery = "";
      searchTerms = [];
      searchResults = null;
      rerender();
      return;
    }
    const ctl = new AbortController();
    searchAbort = ctl;
    searchInfoEl.className = "search-info";
    searchInfoEl.textContent = "Suche läuft …";
    try {
      const r = await fetch("/chat-search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q, sids: lastChats.map((c) => c.session_id) }),
        signal: ctl.signal,
      });
      let data = null;
      try { data = await r.json(); } catch (e) { /* kein JSON — Status reicht */ }
      if (!r.ok) {
        // Fehler im Suchausdruck (z. B. offene Klammer) meldet der Server im Klartext.
        throw new Error(data && data.error ? "Suchausdruck: " + data.error : "HTTP " + r.status);
      }
      searchQuery = q;
      searchTerms = data.terms || [];
      searchResults = data.results || {};
    } catch (err) {
      if (err.name === "AbortError") return; // neuere Suche läuft schon
      searchQuery = "";
      searchTerms = [];
      searchResults = null;
      rerender();
      searchInfoEl.className = "search-info error";
      searchInfoEl.textContent = String(err.message || err);
      return;
    } finally {
      if (searchAbort === ctl) searchAbort = null;
    }
    rerender();
    searchJump = -1;
    if (jump) jumpToHit(); // erster Treffer ins Bild
  }

  // Scrollt zum nächsten markierten Treffer (Enter im Suchfeld), nach dem
  // letzten wieder zum ersten.
  function jumpToHit() {
    const hits = [...rowsEl.querySelectorAll("tr.row.hit")];
    if (!hits.length) return;
    searchJump = (searchJump + 1) % hits.length;
    hits[searchJump].scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function updateSortArrows() {
    document.querySelectorAll("th.sortable").forEach((th) => {
      const arrow = th.querySelector(".arrow");
      arrow.textContent = th.dataset.sort === sortKey ? (sortAsc ? "▲" : "▼") : "";
    });
  }

  function formatAge(sec) {
    if (sec < 60) return "gerade eben";
    const min = Math.floor(sec / 60);
    if (min < 60) return `vor ${min} min`;
    const h = Math.floor(min / 60);
    if (h < 24) return h === 1 ? "vor 1 Std" : `vor ${h} Std`;
    const d = Math.floor(h / 24);
    if (d === 1) return "gestern";
    if (d < 7) return `vor ${d} Tagen`;
    const dt = new Date(Date.now() - sec * 1000);
    return `${String(dt.getDate()).padStart(2, "0")}.${String(dt.getMonth() + 1).padStart(2, "0")}.`;
  }

  async function loadSettings() {
    try {
      const r = await fetch("/settings");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const s = await r.json();
      perDirEl.value = s.chats?.per_dir ?? 3;
      totalEl.value = s.chats?.total ?? 10;
      activeFirstEl.checked = s.chats?.active_first ?? false;
      showWorkersEl.checked = s.chats?.show_workers ?? false;
      onlyFavoritesEl.checked = s.chats?.only_favorites ?? false;
      onlyHitsEl.checked = s.chats?.only_hits ?? true;
      detailLines = s.chats?.detail_lines ?? DETAIL_LINES_DEFAULT;
    } catch (e) {
      perDirEl.value = 3;
      totalEl.value = 10;
      activeFirstEl.checked = false;
      showWorkersEl.checked = false;
      onlyFavoritesEl.checked = false;
      onlyHitsEl.checked = true;
    }
  }

  async function saveSettings() {
    const per_dir = Math.max(1, Math.min(20, parseInt(perDirEl.value, 10) || 3));
    const total = Math.max(1, Math.min(100, parseInt(totalEl.value, 10) || 10));
    perDirEl.value = per_dir;
    totalEl.value = total;
    try {
      await fetch("/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chats: {
            per_dir, total,
            active_first: activeFirstEl.checked,
            show_workers: showWorkersEl.checked,
            only_favorites: onlyFavoritesEl.checked,
            only_hits: onlyHitsEl.checked,
            detail_lines: detailLines,
          },
        }),
      });
    } catch (e) { /* Anzeige funktioniert auch ohne Persistenz */ }
  }

  function renderRows(chats) {
    rowsEl.textContent = "";
    for (const chat of chats) {
      const tr = document.createElement("tr");
      tr.className = "row";
      if (searchResults) tr.classList.add(searchHit(chat) ? "hit" : "nohit");
      tr.dataset.sid = chat.session_id;
      tr.dataset.cwd = chat.cwd || "";

      const tdDir = document.createElement("td");
      tdDir.className = "dir";
      tdDir.title = chat.cwd || chat.dir_name;
      if (chat.active) {
        const live = document.createElement("span");
        live.className = "live";
        live.textContent = "●";
        live.title = "Session läuft gerade";
        tdDir.appendChild(live);
      }
      tdDir.appendChild(document.createTextNode(chat.dir_name));

      const tdAge = document.createElement("td");
      tdAge.className = "age";
      tdAge.textContent = formatAge(chat.age_seconds);
      tdAge.title = new Date(chat.mtime * 1000).toLocaleString("de-DE");

      tr.append(buildFavCell(chat), tdDir, tdAge, buildTopicCell(chat), buildDeleteCell(chat));
      rowsEl.appendChild(tr);
    }
    // Ein aufgeklappter Verlauf bleibt offen (z. B. beim Verfeinern der Suche).
    if (expandedSid) {
      const row = [...rowsEl.querySelectorAll("tr.row")]
        .find((r) => r.dataset.sid === expandedSid);
      if (row) openDetail(row);
      else expandedSid = null;
    }
  }

  // Der automatisch vergebene Titel (bzw. sein Fallback) — als Anzeige, wenn
  // kein eigener Name gesetzt ist, sonst als Tooltip hinter dem eigenen Namen.
  function autoTopicText(chat) {
    return chat.title || chat.last_prompt || "(ohne Titel)";
  }

  // Thema-Zelle: zeigt den eigenen Namen (falls vergeben, Tooltip = der
  // automatische Titel) oder den automatischen Titel/Fallback. Der ✎-Knopf
  // (sichtbar beim Überfahren der Zeile) öffnet ein Inline-Eingabefeld;
  // leerer Name stellt den automatischen Titel wieder her.
  function buildTopicCell(chat) {
    const td = document.createElement("td");
    td.className = "topic";
    const showView = () => {
      td.textContent = "";
      const hit = searchHit(chat);
      if (hit) {
        const chip = document.createElement("span");
        chip.className = "hit-chip";
        if (hit.hits) {
          chip.textContent = `🔍 ${hit.hits}`;
          chip.title = `Suchbegriffe in ${hit.hits} ${hit.hits === 1 ? "Nachricht" : "Nachrichten"} ` +
            "dieses Chats — Zeile anklicken zeigt die Fundstellen";
        } else if (hit.in_title) {
          chip.textContent = "🔍 Titel";
          chip.title = "Passt zur Suche — die Suchbegriffe stehen nur im Titel, nicht in den Nachrichten";
        } else {
          chip.textContent = "🔍";
          chip.title = "Passt zur Suche (über NOT) — es gibt keine Fundstellen zu zeigen";
        }
        td.appendChild(chip);
      }
      if (chat.is_worker) {
        const chip = document.createElement("span");
        chip.className = "worker-chip";
        chip.textContent = "⚙ Worker";
        chip.title = "Hintergrund-Worker (Subagent) — von einer Session " +
          "gestarteter Agent, kein interaktiver Chat";
        td.appendChild(chip);
      }
      const span = document.createElement("span");
      if (chat.custom_name) {
        span.className = "custom";
        setHighlighted(span, chat.custom_name, !!hit);
        span.title = autoTopicText(chat);
      } else if (chat.title) {
        setHighlighted(span, chat.title, !!hit);
        if (chat.title_source === "first_prompt") span.className = "fallback";
      } else if (chat.last_prompt) {
        span.className = "fallback";
        setHighlighted(span, chat.last_prompt, !!hit);
      } else {
        span.className = "none";
        span.textContent = "(ohne Titel)";
      }
      const btn = document.createElement("button");
      btn.className = "rename-btn";
      btn.textContent = "✎";
      btn.title = chat.custom_name
        ? "Eigenen Namen ändern — leeres Feld stellt den automatischen Titel wieder her"
        : "Diesem Chat einen eigenen Namen geben — der automatische Titel bleibt als Tooltip erhalten";
      btn.addEventListener("click", (e) => {
        e.stopPropagation(); // Zeile nicht aufklappen
        showEdit();
      });
      td.append(span, btn);
    };
    const showEdit = () => {
      td.textContent = "";
      const input = document.createElement("input");
      input.className = "rename-input";
      input.maxLength = 120;
      input.value = chat.custom_name || "";
      input.placeholder = autoTopicText(chat);
      input.addEventListener("click", (e) => e.stopPropagation());
      let done = false; // Enter löst auch blur aus — nur einmal speichern
      const commit = async () => {
        if (done) return;
        done = true;
        const name = input.value.trim();
        if (name === (chat.custom_name || "")) { showView(); return; }
        try {
          const r = await fetch("/chat-rename", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sid: chat.session_id, name }),
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          chat.custom_name = name || null;
          if (searchResults) {
            showView();
            runSearch(); // der neue Name kann den Treffer ändern — der Server prüft Namen mit
            return;
          }
        } catch (err) {
          stateEl.className = "state error";
          stateEl.textContent = "Konnte Namen nicht speichern: " + String(err.message || err);
        }
        showView();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit();
        else if (e.key === "Escape") { done = true; showView(); }
      });
      input.addEventListener("blur", commit);
      td.appendChild(input);
      input.focus();
      input.select();
    };
    showView();
    return td;
  }

  // ★-Zelle: schaltet den Favoriten-Status um (POST /chat-favorite, in den
  // Settings persistiert). Favoriten stehen immer oben und fallen nie aus
  // den per_dir/total-Limits heraus — egal wie alt sie sind.
  function buildFavCell(chat) {
    const td = document.createElement("td");
    td.className = "fav";
    const btn = document.createElement("button");
    btn.textContent = chat.favorite ? "★" : "☆";
    btn.className = chat.favorite ? "on" : "";
    btn.title = chat.favorite
      ? "Favorit entfernen — der Chat konkurriert wieder normal um die Listen-Plätze"
      : "Als Favorit anheften — steht immer oben, fällt nie aus den Limits heraus";
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        const r = await fetch("/chat-favorite", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sid: chat.session_id, favorite: !chat.favorite }),
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        chat.favorite = !chat.favorite;
        rerender(); // Zeile rückt sofort an ihren neuen Platz
      } catch (err) {
        btn.disabled = false;
        stateEl.className = "state error";
        stateEl.textContent = "Konnte Favorit nicht speichern: " + String(err.message || err);
      }
    });
    td.appendChild(btn);
    return td;
  }

  // Lösch-Zelle mit Inline-Bestätigung: 🗑 → „Löschen? [Ja] [✕]".
  // Laufende Sessions (●) sind serverseitig geschützt (409) und der Knopf
  // dafür deaktiviert — Claude Code schreibt die Datei noch.
  function buildDeleteCell(chat) {
    const td = document.createElement("td");
    td.className = "del";
    const showButton = () => {
      td.textContent = "";
      const btn = document.createElement("button");
      btn.textContent = "🗑";
      if (chat.active) {
        btn.disabled = true;
        btn.title = "Laufende Session kann nicht gelöscht werden";
      } else {
        btn.title = "Diesen Chat löschen (Session-Datei wird entfernt)";
        btn.addEventListener("click", showConfirm);
      }
      td.appendChild(btn);
    };
    const showConfirm = () => {
      td.textContent = "";
      const wrap = document.createElement("span");
      wrap.className = "confirm";
      wrap.append("Löschen?");
      const yes = document.createElement("button");
      yes.className = "yes";
      yes.textContent = "Ja";
      yes.title = "Chat endgültig löschen — nicht rückgängig zu machen";
      yes.addEventListener("click", async () => {
        yes.disabled = true;
        try {
          const r = await fetch("/chat-delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sid: chat.session_id }),
          });
          if (!r.ok) {
            throw new Error(r.status === 409 ? "Session läuft gerade" : "HTTP " + r.status);
          }
          detailCache.delete(chat.session_id);
          loadChats(); // rückt ggf. einen älteren Chat nach
        } catch (err) {
          showButton();
          stateEl.className = "state error";
          stateEl.textContent = "Konnte Chat nicht löschen: " + String(err.message || err);
        }
      });
      const no = document.createElement("button");
      no.textContent = "✕";
      no.title = "Abbrechen";
      no.addEventListener("click", showButton);
      wrap.append(yes, no);
      td.appendChild(wrap);
    };
    showButton();
    return td;
  }

  async function loadChats() {
    stateEl.className = "state";
    stateEl.textContent = "Lade Chats …";
    rowsEl.textContent = "";
    try {
      const r = await fetch("/chats-data");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      if (!data.chats.length) {
        stateEl.textContent = "Keine Chats gefunden.";
        return;
      }
      stateEl.textContent = "";
      lastChats = data.chats;
      updateSortArrows();
      rerender();
      if (searchEl.value.trim()) runSearch(); // neue Liste neu durchsuchen
    } catch (e) {
      stateEl.className = "state error";
      stateEl.textContent = "Konnte Chats nicht laden: " + String(e.message || e);
    }
  }

  function renderDetail(td, sid, cwd, detail) {
    td.textContent = "";

    const actions = document.createElement("div");
    actions.className = "detail-actions";
    const openBtn = document.createElement("button");
    openBtn.textContent = "📁 Verzeichnis öffnen";
    openBtn.title = "Projektverzeichnis im Dateimanager öffnen";
    openBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      fetch("/open-dir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: cwd, sid }),
      }).catch(() => {});
    });
    actions.appendChild(openBtn);
    if (!detail.is_worker) {
      // Ein Worker-Transkript ist kein fortsetzbarer Chat — kein resume-Knopf.
      const copyBtn = document.createElement("button");
      copyBtn.textContent = "📋 claude --resume kopieren";
      copyBtn.title = "Befehl zum Fortsetzen dieses Chats in die Zwischenablage kopieren";
      copyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        fetch("/copy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: `claude --resume ${sid}` }),
        }).then(() => {
          copyBtn.textContent = "✓ kopiert";
          setTimeout(() => { copyBtn.textContent = "📋 claude --resume kopieren"; }, 1500);
        }).catch(() => {});
      });
      actions.appendChild(copyBtn);
    }
    const linesLabel = document.createElement("label");
    linesLabel.className = "limit";
    linesLabel.title = "Wie viele Textzeilen vom Ende des Chats vollständig angezeigt werden " +
      "(gilt für alle Chats und wird gespeichert)";
    linesLabel.append("Letzte Zeilen");
    const linesInput = document.createElement("input");
    linesInput.type = "number";
    linesInput.min = "1";
    linesInput.max = String(DETAIL_LINES_MAX);
    linesInput.value = detailLines;
    linesInput.addEventListener("change", async () => {
      detailLines = Math.max(1, Math.min(DETAIL_LINES_MAX,
        parseInt(linesInput.value, 10) || DETAIL_LINES_DEFAULT));
      await saveSettings();
      detailCache.clear(); // zwischengespeicherte Verläufe haben die alte Länge
      const row = [...rowsEl.querySelectorAll("tr.row")].find((r) => r.dataset.sid === sid);
      if (row) openDetail(row);
    });
    linesLabel.appendChild(linesInput);
    actions.appendChild(linesLabel);
    const sidEl = document.createElement("span");
    sidEl.className = "sid";
    sidEl.textContent = sid;
    actions.appendChild(sidEl);
    td.appendChild(actions);

    const chat = lastChats.find((c) => c.session_id === sid);
    const hit = chat ? searchHit(chat) : null;

    // Eine Nachricht des Verlaufs bzw. eine Fundstelle; ts nur bei Fundstellen
    // (sie können weit zurückliegen).
    const buildMsg = (role, textValue, ts) => {
      const box = document.createElement("div");
      box.className = "msg " + role;
      const who = document.createElement("div");
      who.className = "who";
      // In Worker-Transkripten ist die "User"-Seite die startende Session.
      who.textContent = role === "user"
        ? (detail.is_worker ? "Auftrag" : "Du")
        : (detail.is_worker ? "Worker" : "Claude");
      if (ts) {
        const dt = new Date(ts);
        if (!isNaN(dt)) {
          who.textContent += " · " + dt.toLocaleString("de-DE", {
            day: "2-digit", month: "2-digit", year: "numeric",
            hour: "2-digit", minute: "2-digit",
          });
        }
      }
      const text = document.createElement("div");
      text.className = "text";
      setHighlighted(text, textValue, !!hit);
      box.append(who, text);
      return box;
    };

    // 🔍 Fundstellen aus dem ganzen Chat — der Verlauf darunter zeigt nur das Ende.
    if (hit && hit.snippets.length) {
      const hits = document.createElement("div");
      hits.className = "hits";
      const title = document.createElement("div");
      title.className = "hits-title";
      const msgs = (n) => (n === 1 ? "1 Nachricht" : `${n} Nachrichten`);
      title.textContent = hit.hits > hit.snippets.length
        ? `🔍 Suchbegriffe in ${msgs(hit.hits)} — ${hit.snippets.length} Fundstellen:`
        : `🔍 Suchbegriffe in ${msgs(hit.hits)}:`;
      hits.appendChild(title);
      for (const sn of hit.snippets) hits.appendChild(buildMsg(sn.role, sn.text, sn.ts));
      td.appendChild(hits);
      if (detail.messages.length) {
        const tailTitle = document.createElement("div");
        tailTitle.className = "tail-title";
        tailTitle.textContent = "Ende des Chats:";
        td.appendChild(tailTitle);
      }
    }

    if (!detail.messages.length) {
      const empty = document.createElement("div");
      empty.className = "detail-hint";
      empty.textContent = "Keine darstellbaren Nachrichten im Datei-Ende gefunden.";
      td.appendChild(empty);
      return;
    }
    if (detail.partial) {
      const hint = document.createElement("div");
      hint.className = "detail-hint";
      hint.textContent = `Die letzten ${detailLines} Zeilen des Chats — ältere Teile sind ` +
        "ausgeblendet. Mehr zeigt ein größerer Wert bei „Letzte Zeilen“.";
      td.appendChild(hint);
    }
    for (const msg of detail.messages) {
      // Nur die älteste gezeigte Nachricht kann vorn gekürzt sein.
      td.appendChild(buildMsg(msg.role, (msg.cut_head ? "… " : "") + msg.text));
    }
  }

  rowsEl.addEventListener("click", (e) => {
    if (e.target.closest("td.del")) return; // Löschen klappt den Verlauf nicht auf/zu
    if (e.target.closest("td.fav")) return; // ★ ebenso wenig
    const row = e.target.closest("tr.row");
    if (!row) return;
    const existing = row.nextElementSibling;
    if (existing && existing.classList.contains("detail")) {
      existing.remove();
      row.classList.remove("expanded");
      expandedSid = null;
      return;
    }
    openDetail(row);
  });

  async function openDetail(row) {
    document.querySelectorAll("tr.detail").forEach((d) => d.remove());
    document.querySelectorAll("tr.row.expanded").forEach((r) => r.classList.remove("expanded"));

    row.classList.add("expanded");
    const sid = row.dataset.sid;
    expandedSid = sid;
    const detailTr = document.createElement("tr");
    detailTr.className = "detail";
    const td = document.createElement("td");
    td.colSpan = 5;
    td.textContent = "Lade Verlauf …";
    detailTr.appendChild(td);
    row.after(detailTr);

    try {
      let detail = detailCache.get(sid);
      if (!detail) {
        const r = await fetch(`/chat-detail?sid=${encodeURIComponent(sid)}&lines=${detailLines}`);
        if (!r.ok) throw new Error("HTTP " + r.status);
        detail = await r.json();
        detailCache.set(sid, detail);
      }
      renderDetail(td, sid, row.dataset.cwd, detail);
    } catch (err) {
      td.textContent = "Konnte Verlauf nicht laden: " + String(err.message || err);
    }
  }

  document.querySelectorAll("th.sortable").forEach((th) => {
    th.addEventListener("click", () => {
      if (sortKey === th.dataset.sort) {
        sortAsc = !sortAsc;
      } else {
        sortKey = th.dataset.sort;
        sortAsc = true;
      }
      updateSortArrows();
      rerender();
    });
  });

  document.getElementById("refresh-btn").addEventListener("click", () => {
    detailCache.clear();
    loadChats();
  });
  perDirEl.addEventListener("change", async () => { await saveSettings(); loadChats(); });
  totalEl.addEventListener("change", async () => { await saveSettings(); loadChats(); });
  activeFirstEl.addEventListener("change", () => {
    saveSettings(); // Umsortieren braucht keinen neuen Fetch
    rerender();
  });
  onlyFavoritesEl.addEventListener("change", () => {
    saveSettings(); // Favoriten sind immer mitgeladen — nur filtern, kein Fetch
    rerender();
  });
  onlyHitsEl.addEventListener("change", () => {
    saveSettings(); // Treffer sind schon da — nur filtern, kein Fetch
    rerender();
  });
  showWorkersEl.addEventListener("change", async () => {
    await saveSettings(); // Server filtert Worker beim Listen — neu laden
    loadChats();
  });
  searchEl.addEventListener("input", () => {
    clearTimeout(searchTimer);
    if (!searchEl.value.trim()) { runSearch(); return; } // geleert: Markierung sofort weg
    updateSearchInfo(sortedChats());
    searchTimer = setTimeout(() => runSearch(true), SEARCH_DEBOUNCE_MS);
  });
  searchEl.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { // leert die Suche (nicht in jedem Browser Standard)
      searchEl.value = "";
      runSearch();
      return;
    }
    if (e.key !== "Enter") return;
    // Fertige Suche für genau diesen Begriff: zum nächsten Treffer springen;
    // sonst sofort suchen, ohne die Tipp-Pause abzuwarten.
    if (searchResults && searchEl.value.trim() === searchQuery && !searchAbort) jumpToHit();
    else runSearch(true);
  });

  loadSettings().then(loadChats);

  // Fenster auf allen Arbeitsflächen anzeigen (abschaltbar über
  // windows.sticky in ~/.config/claude-token-monitor/config.json)
  fetch("/sticky", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: document.title }),
  }).catch(() => {});
  </script>
</body>
</html>
